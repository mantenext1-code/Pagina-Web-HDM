<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservar Tutoría — Literatura — Centro de Tutorías</title>

  <!-- Fuente Inter: <link> en lugar de @import para evitar error CORS en file:// -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Único archivo CSS compartido por las 6 pantallas de reserva -->
  <link rel="stylesheet" href="estilos-reserva.css" />
</head>

<!-- .tema-azul inyecta --color-tema y --color-tema-claro para Literatura -->
<body class="tema-azul">

  <!-- ════════════════════════════════════════════════════
       ENCABEZADO NARANJA (idéntico al resto de la plataforma)
  ════════════════════════════════════════════════════ -->
  <header class="encabezado-plataforma" aria-label="Encabezado principal">

    <div class="encabezado-fila-superior">
      <h1 class="encabezado-titulo">Centro de Tutorías</h1>

      <div class="encabezado-acciones">

        <button class="boton-icono"
                aria-label="Notificaciones"
                data-accion="notificaciones">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>

        <button class="boton-icono"
                aria-label="Configuración"
                data-accion="configuracion">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="7.5" cy="15.5" r="5.5"/>
            <path d="M21 2l-9.6 9.6"/>
            <path d="M15.5 7.5 19 4"/>
          </svg>
        </button>

        <button class="boton-salir" data-accion="salir">Salir</button>
      </div>
    </div>

    <!-- Barra de navegación: pestaña "Tutorías" activa (origen del flujo de reserva) -->
    <nav class="barra-navegacion" aria-label="Secciones" role="tablist">

      <button class="pestana-nav" role="tab" aria-selected="false"
              data-accion="nav" data-valor="inicio">Inicio</button>

      <button class="pestana-nav" role="tab" aria-selected="false"
              data-accion="nav" data-valor="horarios">Horarios</button>

      <button class="pestana-nav pestana-nav--activa" role="tab" aria-selected="true"
              data-accion="nav" data-valor="tutorias">Tutorías</button>

      <button class="pestana-nav" role="tab" aria-selected="false"
              data-accion="nav" data-valor="foro">Foro</button>

    </nav>

  </header>


  <!-- ════════════════════════════════════════════════════
       CONTENIDO PRINCIPAL — RESERVAR TUTORÍA (PASO 2)
  ════════════════════════════════════════════════════ -->
  <main class="contenido-reserva" role="main">

    <div class="tarjeta-reserva">

      <!-- ── Encabezado del flujo ── -->
      <div class="reserva-encabezado">
        <div class="reserva-fila-titulo">
          <span class="reserva-icono-titulo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </span>
          <h2 class="reserva-titulo">Reservar Tutoría</h2>
        </div>
        <p class="reserva-subtitulo">
          Sigue los pasos para reservar tu espacio en las tutorías
        </p>
      </div>

      <!-- ── Indicador de pasos: 1.Materia → 2.Día → 3.Horario → 4.Dato ── -->
      <div class="indicador-pasos" aria-label="Progreso de la reserva">
        <div class="paso paso--completo">
          <span class="paso-circulo" aria-hidden="true">1</span>
          <span class="paso-etiqueta">Materia</span>
        </div>
        <div class="paso paso--activo">
          <span class="paso-circulo" aria-hidden="true">2</span>
          <span class="paso-etiqueta">Día</span>
        </div>
        <div class="paso">
          <span class="paso-circulo" aria-hidden="true">3</span>
          <span class="paso-etiqueta">Horario</span>
        </div>
        <div class="paso">
          <span class="paso-circulo" aria-hidden="true">4</span>
          <span class="paso-etiqueta">Dato</span>
        </div>
      </div>

      <!-- ── Sección: Seleccionar día ── -->
      <section aria-labelledby="titulo-seleccionar-dia">
        <h3 class="reserva-seccion-titulo" id="titulo-seleccionar-dia">Seleccionar día</h3>

        <!-- Resumen de la materia elegida en el Paso 1 -->
        <div class="tarjeta-materia-resumen" style="margin-top: 10px; margin-bottom: 14px;">
          <span class="materia-resumen-icono" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 6s2-2 5-2 5 2 5 2v14s-2-1-5-1-5 1-5 1V6z"/>
              <path d="M12 6s2-2 5-2 5 2 5 2v14s-2-1-5-1-5 1-5 1V6z"/>
              <line x1="12" y1="6" x2="12" y2="20"/>
            </svg>
          </span>
          <div class="materia-resumen-textos">
            <span class="materia-resumen-nombre">Literatura</span>
            <span class="materia-resumen-profesor">Prof. Rebecca Gómez</span>
          </div>
        </div>

        <!-- Lista de días disponibles para Literatura -->
        <div class="lista-dias" role="list">
          <a class="tarjeta-dia" href="horario-literatura.html" role="listitem">
            <span class="tarjeta-dia-icono" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
            </span>
            <span class="tarjeta-dia-nombre">Lunes</span>
            <svg class="tarjeta-dia-flecha" viewBox="0 0 24 24" aria-hidden="true">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </a>

          <a class="tarjeta-dia" href="horario-literatura.html" role="listitem">
            <span class="tarjeta-dia-icono" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
            </span>
            <span class="tarjeta-dia-nombre">Viernes</span>
            <svg class="tarjeta-dia-flecha" viewBox="0 0 24 24" aria-hidden="true">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </a>
        </div>
      </section>

      <!-- ── Botón Volver ── -->
      <button class="boton-volver" type="button" data-accion="volver-paso">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Volver
      </button>

    </div>

  </main>


  <!-- ════════════════════════════════════════════════════
       PIE DE PÁGINA MARRÓN
  ════════════════════════════════════════════════════ -->
  <footer class="pie-pagina">
    <p>©2026 Centro de Tutorías — Todos los derechos reservados.<br>
       Comprometidos con tu éxito académico.</p>
  </footer>

  <!-- JS unificado del proyecto — al final del <body> para que el DOM exista -->
  <script src="../js/reservas.js"></script>

</body>
</html>
